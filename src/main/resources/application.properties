# Spring Boot configures the connection pool from these properties.
# Supply DB_URL, DB_USERNAME, and DB_PASSWORD through the process environment.
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=ChomNesSystem;encrypt=true;trustServerCertificate=false}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Validate mappings against the existing database; do not create or alter tables automatically.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Apply versioned SQL Server migrations from classpath:db/migration before JPA validation.
spring.flyway.enabled=true
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=26MB

# Set JWT_SECRET_BASE64 to a random Base64-encoded secret of at least 32 bytes.
app.jwt.secret-base64=${JWT_SECRET_BASE64}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
# Optional one-time key for POST /api/auth/bootstrap-admin; use at least 32 random characters.
app.auth.bootstrap-key=${ADMIN_BOOTSTRAP_KEY:}
# Signed attendance QR tokens expire after this many seconds (1 through 900).
app.attendance.qr-ttl-seconds=${ATTENDANCE_QR_TTL_SECONDS:120}

# Payment providers are optional; configure their secrets through the environment.
app.payments.stripe.secret-key=${STRIPE_SECRET_KEY:}
app.payments.stripe.public-key=${STRIPE_PUBLIC_KEY:}
app.payments.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
app.payments.server-url=${SERVER_URL:}
app.payments.system-user-id=${SYSTEM_USER_ID:}
app.payments.bakong.account-id=${BAKONG_ACCOUNT_ID:}
app.payments.bakong.merchant-name=${MERCHANT_NAME:}
app.payments.bakong.merchant-city=${MERCHANT_CITY:}
app.payments.bakong.merchant-phone=${MERCHANT_PHONE:}
app.payments.bakong.store-label=${STORE_LABEL:}
app.payments.bakong.api-url=${BAKONG_API_URL:https://api-bakong.nbc.gov.kh}
app.payments.bakong.api-token=${BAKONG_API_TOKEN:}
app.payments.bakong.api-enabled=${BAKONG_API_ENABLED:false}
app.payments.bakong.khr-per-usd=${BAKONG_KHR_PER_USD:4000}

# Uploaded certificates and lesson resources are private and served through authenticated endpoints.
app.files.storage-dir=${FILE_STORAGE_DIR:./uploads}

# Optional payment notices. Email is sent to the student's first emergency contact with an email address.
app.notifications.telegram-token=${TELEGRAM_BOT_TOKEN:}
app.notifications.telegram-chat-id=${TELEGRAM_BOT_ID:}
app.notifications.smtp-host=${EMAIL_SMTP_HOST:}
app.notifications.smtp-port=${EMAIL_SMTP_PORT:587}
app.notifications.smtp-username=${EMAIL_SENDER_ADDRESS:}
app.notifications.smtp-password=${EMAIL_APP_PASSWORD:}
app.notifications.mail-from=${EMAIL_SENDER_ADDRESS:}
