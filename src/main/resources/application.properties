# Spring Boot configures the connection pool from these properties.
# Supply DB_URL, DB_USERNAME, and DB_PASSWORD through the process environment.
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=ChomNesSystem;encrypt=true;trustServerCertificate=false}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Validate mappings against the existing database; do not create or alter tables automatically.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Apply versioned SQL Server migrations from classpath:db/migration before JPA validation.
spring.flyway.enabled=true

# Set JWT_SECRET_BASE64 to a random Base64-encoded secret of at least 32 bytes.
app.jwt.secret-base64=${JWT_SECRET_BASE64}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
# Optional one-time key for POST /api/auth/bootstrap-admin; use at least 32 random characters.
app.auth.bootstrap-key=${ADMIN_BOOTSTRAP_KEY:}
